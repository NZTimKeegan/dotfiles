[general]
import = ["~/.config/alacritty/dracula.toml"]

[font]
size = 14.0

[font.normal]
family = "Iosevka Nerd Font Mono"
style = "Regular"

[font.bold]
family = "Iosevka Nerd Font Mono"
style = "Bold"

[font.italic]
family = "Iosevka Nerd Font Mono"
style = "Italic"

[window]
decorations = "None"
startup_mode = "Maximized"

# Shift+Return sends ESC+CR instead of a plain newline, so multiline-aware
# programs treat it as "insert a newline" rather than submit.
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
